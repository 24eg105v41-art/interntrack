spring.application.name=intern-track

# MySQL connection settings (overridable via environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/interntrack_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Jackson / JSON
spring.jackson.serialization.write-dates-as-timestamps=false

# Server
server.port=${PORT:8080}

# Security / JWT
# Override JWT_SECRET in production. Must be at least 32 bytes (256-bit) long.
interntrack.jwt.secret=${JWT_SECRET:interntrack-development-secret-key-change-me-in-production-0123456789}
interntrack.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Seed credentials (first start only)
interntrack.seed.admin-email=${ADMIN_EMAIL:admin@interntrack.com}
interntrack.seed.admin-password=${ADMIN_PASSWORD:Admin@123}

# Deadline board policy: deadlines within this many days are flagged "SOON".
interntrack.deadline.soon-days=${DEADLINE_SOON_DAYS:3}
# An offer stays PENDING for this many days when no response deadline is given.
interntrack.offer.default-response-days=${OFFER_RESPONSE_DAYS:7}

# Logging
logging.level.org.hibernate.SQL=WARN
