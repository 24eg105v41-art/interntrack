services:
  - type: web
    name: interntrack-backend
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        value: admin@interntrack.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: SPRING_JPA_DDL_AUTO
        value: update
      - key: DEADLINE_SOON_DAYS
        value: "3"
      - key: OFFER_RESPONSE_DAYS
        value: "7"
